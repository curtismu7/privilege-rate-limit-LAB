# OrbStack:  docker compose up --build -d   ->  http://127.0.0.1:7837      (Docker is OrbStack, never Docker Desktop)
# The server binds 0.0.0.0 INSIDE the container (PRL_BIND is the opt-in), but the port is published on loopback only.
# Do not change the 127.0.0.1 below. Port 7837 is PROVISIONAL (not claimed on the board yet); HOST_PORT overrides the host side.
# Mock only: no .env, no key, no secrets. The lab makes no outbound call.
# Optional brand override: put customer.config.json (see customer.config.example.json) in ./config/ (git-ignored); it is mounted read-only at /run/config and the
# server reads it from there (CUSTOMER_CONFIG). A missing file is not an error: the lab then uses its default cast.
name: privilege-rate-limit-lab

services:
  privilege-rate-limit-lab:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-7837}:7837"
    environment:
      PORT: "7837"
      PRL_BIND: 0.0.0.0
      CUSTOMER_CONFIG: ${CUSTOMER_CONFIG:-/run/config/customer.config.json}
      LAB_ALLOWED_HOSTS: ${LAB_ALLOWED_HOSTS:-local.ping-devops.com,privilege-rate-limit-lab.local.ping-devops.com}
    volumes:
      - ./config:/run/config:ro
    read_only: true
    tmpfs:
      - /tmp
    user: node
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7837/api/health').then(r=>r.json()).then(j=>process.exit(j.schema==='demo-health/1'&&j.state==='ready'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      start_period: 5s
      start_interval: 2s
      timeout: 5s
      retries: 3
